[project]
name = "alarmclock"
version = "1.0.0"
description = "Production-grade command-line alarm clock: recurring alarms, daemon mode, JSON output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
keywords = ["alarm", "cli", "scheduler", "reminder"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]

[project.scripts]
alarm = "alarmclock.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=alarmclock --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["alarmclock"]
omit = ["*/__pycache__/*"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13", "bandit>=1.8", "pip-audit>=2.7"]
